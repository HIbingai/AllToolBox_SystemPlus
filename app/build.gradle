plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localXposedApis = fileTree(
        dir: rootProject.projectDir.parentFile,
        include: [
                '**/XposedBridgeAPI-89.jar',
                '**/XposedBridgeAPI-82.jar',
                '**/libXposed-Api-101.0.1.aar'
        ]
)

if (localXposedApis.isEmpty()) {
    throw new RuntimeException("No local Xposed API artifacts found under: ${rootProject.projectDir.parentFile}")
}

android {
    namespace 'com.atb.systemplus'
    compileSdk 33

    defaultConfig {
        applicationId "com.atb.systemplus"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    compileOnly localXposedApis
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}
